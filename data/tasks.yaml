# Benchmark tasks. Edit freely.
#
# Fields
#   id                 unique id
#   question           the task given to the agent
#   answer             the known correct answer
#   grading            how to compare the agent's answer:
#                        {type: numeric, tolerance: <abs>}   the answer must contain a number within tolerance
#                        {type: contains_all, values: [..]}  every value must appear as a whole word/phrase (case-insensitive)
#                        {type: exact}                       normalized string equality
#   steps              length of the canonical solution in tool calls (difficulty measure).
#                      Clever batching can sometimes use fewer calls; this is the natural plan length.
#   required_tools     tools a correct solution must use; "a|b" means either one
#   intermediates      values that must show up in tool outputs along a correct path
#                      (used by the failure heuristics to tell "bad plan" from "execution error")
#   trap               optional: the failure the task is designed to provoke
#
# Every answer is checked by tests/test_task_answers.py, which re-derives it with the real tools.

tasks:
  - id: T01_rev_per_employee
    question: "What was Veltrix Dynamics' 2023 revenue per employee in US dollars, rounded to the nearest dollar?"
    answer: 191628
    grading: {type: numeric, tolerance: 0.5}
    steps: 2
    required_tools: [search, calculator|python_exec]
    intermediates: ["412 million", "2,150"]

  - id: T02_founding_gap
    question: "How many years after Veltrix Dynamics was founded was Quorra Biotech founded?"
    answer: 8
    grading: {type: numeric, tolerance: 0}
